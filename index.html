<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f0ff"><title>RecallDeck | Study smarter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><a class="brand" href="#">✳ RecallDeck</a><div class="streak"><span>✦</span> <b id="streak">0</b> day streak</div></header><section class="intro"><div><p class="eyebrow">YOUR PERSONAL STUDY SPACE</p><h1>Make it <em>stick.</em></h1><p class="sub">Small review sessions. Stronger recall. Your cards stay on this device.</p></div><div class="orb">✳</div></section><nav class="tabs"><button class="active" data-tab="review">Review <span id="due-count">0</span></button><button data-tab="cards">My cards <span id="card-count">0</span></button></nav><section id="view"></section><footer>Built for curious minds <span>✳</span> Progress saved locally</footer></main><dialog id="dialog"><form method="dialog" id="card-form"><button class="close" aria-label="Close">×</button><p class="eyebrow">NEW FLASHCARD</p><h2>Add a card</h2><label>Question<textarea id="question" required placeholder="What do you want to remember?"></textarea></label><label>Answer<textarea id="answer" required placeholder="Write a clear, concise answer"></textarea></label><button class="primary">Save card <span>↗</span></button></form></dialog><script src="app.js"></script></body></html>
